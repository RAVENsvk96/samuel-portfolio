<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Case study webu NORTH Barber Studio</title>
  <desc id="desc">Tmavomodrá titulná grafika s pieskovým symbolom nožníc a názvom NORTH Barber Studio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061B3A"/>
      <stop offset="1" stop-color="#03193E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D7A1"/>
      <stop offset="1" stop-color="#C59A5B"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#60A5FA" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
