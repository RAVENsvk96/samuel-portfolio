  <text x="176" y="265" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="66" font-weight="800">NORTH Barber</text>
  <text x="176" y="345" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="42" font-weight="700">Výrazná identita, jasný cieľ</text>
  <text x="176" y="420" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="24">Od predstavenia služieb po jednoduchú rezerváciu</text>
